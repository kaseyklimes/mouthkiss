<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Mouthkiss Cafe</title>
  <meta name="description" content="Mouthkiss Cafe - a cafe in our apartment. Coffee, pastries, and pals.">

  <!-- Open Graph / Social -->
  <meta property="og:site_name" content="Mouthkiss Cafe">
  <meta property="og:title" content="Mouthkiss Cafe">
  <meta property="og:url" content="https://www.mouthkisscafe.com">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.mouthkisscafe.com/assets/logo.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mouthkiss Cafe">
  <meta name="twitter:image" content="https://www.mouthkisscafe.com/assets/logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

  <!-- Fonts loaded via @font-face in styles.css -->

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=2">

  <script src="app.js?v=2" defer></script>
</head>
<body>
  <!-- Main Content -->
  <main class="main">
    <!-- Hero Section with Background -->
    <section class="hero">
      <div class="hero-background"></div>
      <div class="hero-overlay"></div>

      <!-- Header with Logo -->
      <header class="header">
        <a href="/" class="logo-link">
          <img src="assets/logo.png" alt="Mouthkiss Cafe" class="logo">
        </a>
      </header>

      <div class="hero-content">
        <!-- Wavy Marquee -->
        <div class="wavy-marquee">
          <div class="marquee-track" id="marquee-track" aria-hidden="true"></div>
          <span class="marquee-fallback" aria-hidden="true">it’s a cafe in our apartment 〰️</span>
          <span class="sr-only">it's a cafe in our apartment</span>
        </div>

        <!-- Tagline -->
        <h1 class="tagline">coffee ~ pastries ~ pals</h1>

        <!-- Schedule -->
        <p class="schedule">SUNDAY MORNINGS<br>THIS WINTER</p>

        <!-- Fields render locally; MailerLite is contacted only on submission. -->
        <form class="signup-form" id="signup-form" action="https://assets.mailerlite.com/jsonp/2016721/forms/175685961394423216/subscribe" method="post">
          <div class="form-row">
            <div class="form-field">
              <label class="visually-hidden" for="first-name">First name</label>
              <input id="first-name" name="fields[name]" type="text" placeholder="First Name" autocomplete="given-name" required>
            </div>
            <div class="form-field">
              <label class="visually-hidden" for="last-name">Last name</label>
              <input id="last-name" name="fields[last_name]" type="text" placeholder="Last Name" autocomplete="family-name" required>
            </div>
          </div>
          <div class="form-field">
            <label class="visually-hidden" for="email">Email</label>
            <input id="email" name="fields[email]" type="email" placeholder="Email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
          </div>
          <input type="hidden" name="ml-submit" value="1">
          <input type="hidden" name="anticsrf" value="true">
          <button class="submit-btn" type="submit">get a love letter when the cafe is open</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
          <p class="form-help" id="form-help" hidden>Still having trouble? <a href="mailto:pals@mouthkisscafe.com">Email us</a>.</p>
        </form>
      </div>

      <!-- Wave Section Divider -->
      <div class="section-divider">
        <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,40 Q180,0 360,40 T720,40 T1080,40 T1440,40 L1440,60 L0,60 Z" fill="currentColor"/>
        </svg>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <span class="footer-item">Mouthkiss Cafe</span>
      <span class="footer-item">A Place For Pals</span>
      <span class="footer-item">
        <a href="mailto:pals@mouthkisscafe.com">pals@mouthkisscafe.com</a>
      </span>
    </div>
  </footer>
</body>
</html>
